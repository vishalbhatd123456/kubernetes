apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet-k8s-api
  namespace: dotnet-k8s-api
  labels:
    app: dotnet-k8s-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dotnet-k8s-api
  template:
    metadata:
      labels:
        app: dotnet-k8s-api
    spec:
      containers:
        - name: api
          image: dotnet-k8s-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: dotnet-k8s-api-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
